[package]
name = "archive-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Inherits the workspace `unsafe_code = forbid`: the safe adapter contains no
# unsafe, no extern and no raw pointer. All FFI lives in archive-engine-sys.
[lints]
workspace = true

[features]
# Off by default: the default workspace build links no native code, exposes no
# facade operation, and is behaviorally unchanged.
default = []
facade = ["archive-engine-sys/facade"]

[dependencies]
archive-domain = { path = "../archive-domain" }
archive-engine-sys = { path = "../archive-engine-sys" }

# The card's self-owned contract tests drive the raw-ABI lifetime probes that
# live in archive-engine-sys, so the test targets need the facade feature
# enabled on that crate too. This is a dev-only edge: the library's own
# dependency edge above is unchanged.
[dev-dependencies]
archive-engine-sys = { path = "../archive-engine-sys" }
