name: migration-native-cli

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cli:
    name: Legacy CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Build the existing native CLI outside the source tree
        run: |
          set -euo pipefail
          uname -a
          cd CPP/7zip/Bundles/Alone2
          case "$(uname -s)/$(uname -m)" in
            Linux/*)
              gcc --version
              make -j2 -f ../../cmpl_gcc.mak O="$RUNNER_TEMP/migration-cli"
              ;;
            Darwin/arm64)
              clang --version
              make -j2 -f ../../cmpl_mac_arm64.mak O="$RUNNER_TEMP/migration-cli"
              ;;
            Darwin/x86_64)
              clang --version
              make -j2 -f ../../var_mac_x64.mak -f ../../warn_clang_mac.mak \
                -f makefile.gcc O="$RUNNER_TEMP/migration-cli"
              ;;
            *)
              echo 'Unsupported native runner architecture' >&2
              exit 1
              ;;
          esac

      - name: Smoke native archive create, list, test, and extract
        run: python3 .github/scripts/migration-smoke.py "$RUNNER_TEMP/migration-cli/7zz"

      - name: Run existing portable repository checks
        run: |
          set -euo pipefail
          python3 .github/tests/release_version_test.py
          python3 .github/tests/change_notice_test.py "$GITHUB_WORKSPACE"
          python3 .github/tests/lang_files_test.py "$GITHUB_WORKSPACE"
          python3 .github/tests/shell_ext_identity.py "$GITHUB_WORKSPACE"
          python3 .github/tests/shell_ext_lang_reload.py "$GITHUB_WORKSPACE"
          bash .github/tests/release_notes_test.sh
