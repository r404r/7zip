# Windows x64 build for this fork.
#
# 7-Zip is built with nmake and MSVC on Windows; the runner already provides
# both, plus ml64 for the x64 assembly. We locate Visual Studio with vswhere
# and call vcvars64.bat, so no third-party action is needed.
name: build-windows-x64

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: nmake / MSVC x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio with the C++ toolset was not found & exit /b 1)
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          for %%T in (
            "CPP\7zip\Bundles\Alone2"
            "CPP\7zip\Bundles\Format7zF"
            "CPP\7zip\UI\GUI"
            "CPP\7zip\UI\FileManager"
            "CPP\7zip\UI\Console"
            "CPP\7zip\Bundles\SFXWin"
            "CPP\7zip\Bundles\SFXCon"
          ) do (
            echo ::group::nmake %%~T
            pushd "%GITHUB_WORKSPACE%\%%~T" || exit /b 1
            nmake /NOLOGO PLATFORM=x64 || exit /b 1
            popd
            echo ::endgroup::
          )

      - name: List build output
        if: always()
        shell: cmd
        run: dir /s /b "%GITHUB_WORKSPACE%\CPP\7zip\*.exe" "%GITHUB_WORKSPACE%\CPP\7zip\*.dll" 2>nul

      - name: Check zip file name encoding
        shell: cmd
        run: python .github\tests\zip_name_encoding.py "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Alone2\x64\7zz.exe"

      - name: Package the MSI
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $stage = Join-Path $ws "msi-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $src = Join-Path $ws "CPP\7zip"
          $files = @(
            "$src\UI\Console\x64\7z.exe",
            "$src\Bundles\Alone2\x64\7zz.exe",
            "$src\Bundles\Format7zF\x64\7z.dll",
            "$src\UI\GUI\x64\7zG.exe",
            "$src\UI\FileManager\x64\7zFM.exe",
            "$src\Bundles\SFXWin\x64\7z.sfx",
            "$src\Bundles\SFXCon\x64\7zCon.sfx",
            "$ws\DOC\License.txt",
            "$ws\DOC\readme.txt"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing file for the package: $f" }
            Copy-Item $f $stage
          }

          # documents that only some branches carry: take them if they are here
          $optional = @("$ws\DOC\zip-name-encoding.txt")
          $extraRefs = @()
          foreach ($f in $optional) {
            $leaf = Split-Path $f -Leaf
            if (Test-Path $f) {
              Copy-Item $f $stage
              $extraRefs += $leaf
              Write-Host "including $leaf"
            } else {
              # WiX needs the file to exist, so give it an empty stand-in that
              # says why, rather than making the package depend on the branch
              Set-Content -Path (Join-Path $stage $leaf) -Value @(
                "This document is not part of this build.",
                "It comes with the change that adds the code page options.")
              Write-Host "$leaf is not in this branch, a stand-in is used"
            }
          }

          # the version follows the upstream tag, so a rebase can't leave it behind
          $line = Get-Content (Join-Path $ws "DOC\readme.txt") -First 1
          if ($line -notmatch '(\d+)\.(\d+)') { throw "no version in readme.txt: $line" }
          $version = "$($Matches[1]).$([int]$Matches[2]).0"
          Write-Host "version from readme.txt: $version"

          & candle.exe -nologo -arch x64 -dBinDir="$stage" -dVersion="$version" `
              -out "$ws\7zip-fork.wixobj" "$ws\.github\msi\7zip-fork.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle failed" }
          & light.exe -nologo -out "$ws\7zip-fork.msi" "$ws\7zip-fork.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light failed" }

      - name: Check the MSI
        shell: pwsh
        run: |
          # read the package back, so that a broken database is not mistaken
          # for a success just because light.exe returned 0
          $msi = Join-Path $env:GITHUB_WORKSPACE "7zip-fork.msi"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
              'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          function Get-MsiProperty($name) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db,
                @("SELECT Value FROM Property WHERE Property = '$name'"))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) { return $null }
            return $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
          }
          $name = Get-MsiProperty 'ProductName'
          $ver  = Get-MsiProperty 'ProductVersion'
          $upg  = Get-MsiProperty 'UpgradeCode'
          Write-Host "ProductName    = $name"
          Write-Host "ProductVersion = $ver"
          Write-Host "UpgradeCode    = $upg"
          if (-not $name) { throw "no ProductName in the package" }
          if ($name -notmatch 'fork') {
            throw "the name must say that this is not the official 7-Zip: $name"
          }
          if (-not $ver) { throw "no ProductVersion in the package" }
          if ($upg -ne '{123DA846-FD92-4158-B7D8-1C522FE5EB09}') {
            throw "unexpected UpgradeCode, it must not be the one of 7-Zip: $upg"
          }
          Write-Host "the package is readable and is marked as a fork build"

      - uses: actions/upload-artifact@v4
        with:
          name: 7zip-win-x64
          if-no-files-found: error
          path: |
            CPP/7zip/Bundles/Alone2/x64/7zz.exe
            CPP/7zip/Bundles/Format7zF/x64/7z.dll
            CPP/7zip/UI/GUI/x64/7zG.exe
            CPP/7zip/UI/FileManager/x64/7zFM.exe
            CPP/7zip/UI/Console/x64/7z.exe
            CPP/7zip/Bundles/SFXWin/x64/7z.sfx
            CPP/7zip/Bundles/SFXCon/x64/7zCon.sfx
