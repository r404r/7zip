name: s1-native

on:
  push:
    branches: ['wt/t_31358a3f']
  pull_request:
    paths: ['rust/**', '.github/workflows/s1-native.yml', 'docs/ai-migration/qualification/toolchains.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Q1 Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Native owned contracts, boundary controls and locked builds
        run: python rust/tests/run_checks.py native
      - name: Preserve actual native command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-${{ matrix.os }}-${{ github.sha }}
          path: rust/evidence/native/
          if-no-files-found: error
