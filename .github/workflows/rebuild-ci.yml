# Stage 1 of the Rust/QML rebuild pipeline. This workflow deliberately does not
# install, register, sign, package, or release anything. In particular, it does
# not reuse the legacy MSI UpgradeCode, shell CLSID, 7-Zip-fork handler name, or
# install folder. Later stages must make any identity decision explicitly.
name: rebuild-stage1

on:
  push:
    branches: ['wt/t_13a346c7', 'wt/t_acdf81b3']
  pull_request:
    paths: ['rust/**', '.github/workflows/rebuild-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc-abi-convention-qualification:
    name: MSVC ABI convention qualification (non-product)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and diagnostic target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1-x86_64-pc-windows-msvc `
            x86_64-pc-windows-msvc i686-pc-windows-msvc
      - name: Run AMD64 normative and x86 diagnostic convention lanes
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'msvc-abi-convention-probe'
          New-Item -ItemType Directory -Force -Path (Join-Path $evidence 'evidence') | Out-Null
          @(
            "runner.os=${{ runner.os }}"
            "runner.arch=${{ runner.arch }}"
            "ImageOS=$env:ImageOS"
            "ImageVersion=$env:ImageVersion"
            "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
            "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          ) | Set-Content -Encoding UTF8 (Join-Path $evidence 'evidence\runner.txt')
          if ('${{ runner.os }}' -ne 'Windows' -or '${{ runner.arch }}' -ne 'X64' -or
              $env:PROCESSOR_ARCHITECTURE -ne 'AMD64' -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
                [System.Runtime.InteropServices.Architecture]::X64) {
            throw 'The non-product qualification requires a Windows AMD64 runner.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ x86/x64 tools were not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $pristineProcessEnvironment = @{}
          [Environment]::GetEnvironmentVariables('Process').GetEnumerator() |
            ForEach-Object {
              $pristineProcessEnvironment[[string]$_.Key] = [string]$_.Value
            }
          function Restore-PristineProcessEnvironment {
            $current = [Environment]::GetEnvironmentVariables('Process')
            foreach ($name in @($current.Keys)) {
              if (-not $pristineProcessEnvironment.ContainsKey([string]$name)) {
                [Environment]::SetEnvironmentVariable([string]$name, $null, 'Process')
              }
            }
            foreach ($entry in $pristineProcessEnvironment.GetEnumerator()) {
              [Environment]::SetEnvironmentVariable(
                [string]$entry.Key, [string]$entry.Value, 'Process'
              )
            }
          }
          function Import-VcVars([string]$target) {
            Restore-PristineProcessEnvironment
            cmd /d /s /c "`"$vcvars`" $target >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
            }
            if ($LASTEXITCODE -ne 0) { throw "vcvarsall failed for $target" }
          }
          $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          Import-VcVars 'amd64'
          python rust/bridge/msvc-abi-convention-probe.py `
            --root $env:GITHUB_WORKSPACE --output $evidence --diagnostics-only amd64
          $amd64Diagnostics = $LASTEXITCODE
          Import-VcVars 'x86'
          python rust/bridge/msvc-abi-convention-probe.py `
            --root $env:GITHUB_WORKSPACE --output $evidence --diagnostics-only x86
          $x86Diagnostics = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
          @(
            "amd64_exit=$amd64Diagnostics"
            "x86_exit=$x86Diagnostics"
          ) | Set-Content -Encoding UTF8 `
            (Join-Path $evidence 'evidence\compile-diagnostic-sweeps.txt')
          foreach ($arch in @('amd64', 'x86')) {
            $summary = Join-Path $evidence "evidence\$arch\compile-diagnostic-summary.txt"
            if (Test-Path $summary) {
              Write-Host "=== $arch compile diagnostic summary ==="
              Get-Content $summary
            }
          }
          if ($amd64Diagnostics -ne 0 -or $x86Diagnostics -ne 0) {
            throw "MSVC compile diagnostic sweeps failed after both architectures were collected: AMD64=$amd64Diagnostics x86=$x86Diagnostics"
          }
          Import-VcVars 'amd64'
          python rust/bridge/msvc-abi-convention-probe.py `
            --root $env:GITHUB_WORKSPACE --output $evidence --arch amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-VcVars 'x86'
          python rust/bridge/msvc-abi-convention-probe.py `
            --root $env:GITHUB_WORKSPACE --output $evidence --arch x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/bridge/msvc-abi-convention-probe.py `
            --root $env:GITHUB_WORKSPACE --output $evidence --finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content (Join-Path $evidence 'evidence\SUMMARY.txt')
      - name: Publish non-product MSVC ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-abi-convention-probe-${{ github.sha }}
          path: ${{ runner.temp }}/msvc-abi-convention-probe/evidence
          if-no-files-found: error

  rust-workspace:
    name: Rust workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust workspace
        working-directory: rust
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --check
          cargo +1.97.1 clippy --workspace --all-targets
          cargo +1.97.1 build --workspace
          cargo +1.97.1 test --workspace
      - name: Stage Linux development artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rebuild-stage1-linux-development"
          mkdir -p "$stage/rust-workspace-target"
          cp -a rust/target/debug "$stage/rust-workspace-target/debug"
          cat > "$stage/manifest.txt" <<EOF
          commit_sha=$GITHUB_SHA
          branch=$GITHUB_REF_NAME
          toolchain_version=1.97.1
          platform=Linux
          architecture=$(uname -m)
          component.rust_workspace=cargo fmt --check; cargo clippy --workspace --all-targets; cargo build --workspace; cargo test --workspace: passed
          component.runnable_binary=none; the workspace has no binary target
          component.native_facade=not included; see the separate facade-probe job artifact

          THIS IS A DEVELOPMENT artifact.
          qualified_operations is 0.
          No archive operation is implemented.
          This is not a qualified CI/native release result.
          EOF
      - name: Publish Linux development artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-stage1-linux-development-${{ github.sha }}
          path: ${{ runner.temp }}/rebuild-stage1-linux-development
          if-no-files-found: error

  facade-probe:
    name: Retained facade probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain for facade contracts
        if: runner.os != 'Windows'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Prepare evidence validator
        if: runner.os != 'Windows'
        run: |
          python3 -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pip install jsonschema==4.25.1
      - name: Diagnose complete Apple Clang bridge warnings
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          # Diagnostic only: keep -Werror, omit only the retained
          # -Wfatal-errors so every bridge-owned warning lands in the artifact.
          # The formal facade build below remains fail-closed and unchanged.
          probe="$RUNNER_TEMP/rebuild-facade-probe"
          mkdir -p "$probe"
          status=0
          flags=(-arch arm64 -O2 -c -Werror -Wall -Wextra -Weverything
            -Wno-poison-system-directories -DNDEBUG -D_REENTRANT
            -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -fPIC -std=c++11)
          clang++ "${flags[@]}" -I rust/bridge -I . \
            rust/bridge/archive_bridge_v1.cpp \
            -o "$RUNNER_TEMP/archive_bridge_v1-warning-audit.o" \
            > "$probe/apple-clang-archive_bridge_v1.log" 2>&1 || status=$?
          clang++ "${flags[@]}" -I rust/bridge -I . \
            rust/bridge/archive_bridge_registration.cpp \
            -o "$RUNNER_TEMP/archive_bridge_registration-warning-audit.o" \
            > "$probe/apple-clang-archive_bridge_registration.log" 2>&1 || status=$?
          clang++ "${flags[@]}" -I rust/bridge \
            rust/bridge/archive_bridge_registration_correspondence.cpp \
            -o "$RUNNER_TEMP/archive_bridge_registration_correspondence-warning-audit.o" \
            > "$probe/apple-clang-archive_bridge_registration_correspondence.log" 2>&1 || status=$?
          clang++ "${flags[@]}" -I rust/bridge -I . \
            rust/bridge/test-registration-shim.cpp \
            -o "$RUNNER_TEMP/test-registration-shim-warning-audit.o" \
            > "$probe/apple-clang-test-registration-shim.log" 2>&1 || status=$?
          exit "$status"
      - name: Attempt retained-engine facade build
        id: facade-posix
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          probe="$RUNNER_TEMP/rebuild-facade-probe"
          mkdir -p "$probe"
          printf '%s\n' \
            'python3 rust/bridge/build-manifest.py --output <probe>/development-evidence' \
            > "$probe/facade-command.txt"
          "$RUNNER_TEMP/evidence-venv/bin/python" rust/bridge/build-manifest.py \
            --output "$probe/development-evidence" > "$probe/facade.log" 2>&1
      - name: Run linked facade contracts and frozen-reference fault injection
        id: facade-contract
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/rebuild-facade-probe"
          evidence="$probe/development-evidence"
          build="$evidence/build"
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$build/libarchive_bridge_v1.so" "$build/libarchive_bridge_v1.dylib"
            frozen_system=Darwin
          else
            frozen_system=Linux
          fi
          export ARCHIVE_BRIDGE_V1_DEV_MANIFEST="$evidence/facade-build-dev.json"
          export RUSTFLAGS="-L native=$build -l dylib=archive_bridge_v1 -C link-arg=-Wl,-rpath,$build"
          printf '%s\n' \
            'cargo +1.97.1 test --manifest-path rust/Cargo.toml --locked --workspace --exclude archive-qt --features archive-engine/facade -- --nocapture' \
            > "$probe/facade-contract-command.txt"
          cargo +1.97.1 test --manifest-path rust/Cargo.toml --locked --workspace \
            --exclude archive-qt --features archive-engine/facade -- --nocapture \
            > "$probe/facade-contract.log" 2>&1

          jq --arg system "$frozen_system" \
            '(.builds[] | select(.system == $system) | .format_registry[0].registration_id) += 1' \
            docs/ai-migration/qualification/engine-build.json \
            > "$probe/frozen-reference-mutated.json"
          set +e
          ARCHIVE_BRIDGE_V1_FROZEN_REFERENCE="$probe/frozen-reference-mutated.json" \
            cargo +1.97.1 test --manifest-path rust/Cargo.toml --locked \
            -p archive-engine --features facade --test facade_capabilities \
            capabilities_match_the_frozen_q1_reference_exactly -- --nocapture \
            > "$probe/frozen-reference-fault-injection.log" 2>&1
          fault_status=$?
          set -e
          if [ "$fault_status" -eq 0 ]; then
            printf 'FAIL: runtime verifier accepted a mutated frozen registration id\n' >&2
            exit 1
          fi
          if ! grep -F 'capabilities_match_the_frozen_q1_reference_exactly' \
              "$probe/frozen-reference-fault-injection.log" >/dev/null || \
             ! grep -F 'registration id differs for format ' \
              "$probe/frozen-reference-fault-injection.log" >/dev/null; then
            printf 'FAIL: frozen-reference fault injection failed for an unexpected reason\n' >&2
            exit 1
          fi
          printf 'PASS: runtime verifier rejected a mutated frozen registration id (exit=%s)\n' \
            "$fault_status" > "$probe/frozen-reference-fault-injection-result.txt"
      - name: Attempt retained-engine facade build (MSVC declaration)
        id: facade-windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "probe=%RUNNER_TEMP%\rebuild-facade-probe"
          if not exist "%probe%" mkdir "%probe%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio with the C++ toolset was not found > "%probe%\facade.log" & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" > "%probe%\vcvars64.log" 2>&1 || exit /b 1
          cl > "%probe%\compiler.txt" 2>&1
          link > "%probe%\linker.txt" 2>&1
          nmake /? > "%probe%\driver.txt" 2>&1
          pushd CPP\7zip\Bundles\Format7zF
          nmake /NOLOGO /f "%GITHUB_WORKSPACE%\rust\bridge\makefile" PLATFORM=x64 O="%RUNNER_TEMP%\rebuild-facade" > "%probe%\facade.log" 2>&1
          popd
      - name: Record facade probe result
        if: always()
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/rebuild-facade-probe"
          mkdir -p "$probe"
          if [ "$RUNNER_OS" = Windows ]; then
            probe_outcome="${{ steps.facade-windows.outcome }}"
          else
            if [ "${{ steps.facade-posix.outcome }}" = success ] && \
               [ "${{ steps.facade-contract.outcome }}" = success ]; then
              probe_outcome=success
            else
              probe_outcome=failure
            fi
          fi
          if [ "$probe_outcome" = success ]; then
            outcome=passed
          else
            outcome=failed
          fi
          if [ "$RUNNER_OS" != Windows ]; then
            {
              cc --version
              c++ --version
            } > "$probe/compiler-and-cxx.txt" 2>&1
            make --version > "$probe/driver.txt" 2>&1
            rustc +1.97.1 --version --verbose > "$probe/rustc.txt" 2>&1
            "$RUNNER_TEMP/evidence-venv/bin/python" -m pip freeze \
              > "$probe/python-packages.txt"
            if [ "$RUNNER_OS" = macOS ]; then
              ld -v > "$probe/linker.txt" 2>&1
              shasum -a 256 \
                "$probe/development-evidence/build/libarchive_bridge_v1.so" \
                rust/bridge/archive_bridge_v1.h rust/bridge/makefile.gcc \
                docs/ai-migration/qualification/engine-build.json \
                docs/ai-migration/qualification/native-observations.json \
                > "$probe/critical-digests.txt"
            else
              ld --version > "$probe/linker.txt" 2>&1
              sha256sum \
                "$probe/development-evidence/build/libarchive_bridge_v1.so" \
                rust/bridge/archive_bridge_v1.h rust/bridge/makefile.gcc \
                docs/ai-migration/qualification/engine-build.json \
                docs/ai-migration/qualification/native-observations.json \
                > "$probe/critical-digests.txt"
            fi
          fi
          {
            printf 'commit_sha=%s\n' "$GITHUB_SHA"
            printf 'branch=%s\n' "$GITHUB_REF_NAME"
            printf 'toolchain_version=1.97.1\n'
            printf 'platform=%s\n' "$RUNNER_OS"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'component.native_facade=facade probe: %s\n' "$outcome"
            printf 'component.rust_workspace=not run in this job; see the separate Rust workspace job\n'
            printf '\n'
            printf 'THIS IS A DEVELOPMENT artifact.\n'
            printf 'qualified_operations is 0.\n'
            printf 'No archive operation is implemented.\n'
            printf 'This is not a qualified CI/native release result.\n'
          } > "$probe/manifest.txt"
          printf 'facade_probe_outcome=%s\n' "$outcome" > "$probe/outcome.txt"
          cat "$probe/manifest.txt"
          cat "$probe/outcome.txt"
          cat "$probe/facade.log"
      - name: Publish facade probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-stage1-facade-probe-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/rebuild-facade-probe
          if-no-files-found: error
