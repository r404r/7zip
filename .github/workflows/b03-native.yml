name: b03-native

# Full qualification is disabled pending a separate post-preflight human decision.
on:
  push:
    branches: ['wt/t_bf92ce13']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/tests/migration/b03/test_preflight.py -v
  b03:
    # Immutable service run counter, not a reusable opt-in marker. Never advance
    # this slot on failure. Review the exact HEAD on Kanban BEFORE the sole push.
    needs: offline
    if: github.repository == 'r404r/7zip' && github.event_name == 'push' && github.ref == 'refs/heads/wt/t_bf92ce13' && github.run_number == 4 && github.run_attempt == 1 && github.event.before == '500eecdb435d03580ca8f640f72becfb617bff02'
    name: B03 preflight / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      # Review attestation is external (exact Kanban PASS + pre-push comparison),
      # not established by this assignment. Keep checkout/build/probe bound.
      B03_REVIEWED_SHA: ${{ github.sha }}
      B03_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unchanged and test-only CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: python .github/tests/migration/b03/build.py "$RUNNER_TEMP/b03"
      - name: Build unchanged and test-only CLI on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio with the C++ toolset was not found & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python .github/tests/migration/b03/build.py "%RUNNER_TEMP%\b03"
      - name: Directed small sparse and full-volume preflight only
        shell: bash
        run: python .github/tests/migration/b03/preflight.py "$RUNNER_TEMP/b03"
      - name: Upload raw native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b03-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/b03/*.json
            ${{ runner.temp }}/b03/*.log
            ${{ runner.temp }}/b03/frozen/
            ${{ runner.temp }}/b03/b03-*/**/*.zip
            ${{ runner.temp }}/b03/b03-*/**/*.tar
            ${{ runner.temp }}/b03/b03-*/**/*.7z
            ${{ runner.temp }}/b03/b03-*/**/retained/*
          if-no-files-found: error
